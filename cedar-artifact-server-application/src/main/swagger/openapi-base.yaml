# Base OpenAPI document merged into the generated spec by io.swagger.core.v3:swagger-maven-plugin.
# It seeds the info block (version stamped from the POM via resource filtering) and the api_key
# and internal service security schemes. Business operations explicitly require both credentials.
openapi: 3.0.1
info:
  title: CEDAR Artifact Server API
  description: |
    Better Metadata - Better Science

    Internal service: business routes require both X-CEDAR-Artifact-Service-Key and the
    end-user Authorization header. Public callers use resource; a user API key alone is insufficient.

    The artifact server stores templates, template elements, template fields, and template
    instances, and validates every one of them against the CEDAR model before storing it.

    Artifacts use strong ETags for optimistic concurrency. Read the artifact and send the returned
    ETag in `If-Match` when replacing or deleting it. A missing required precondition returns 428;
    a stale or malformed validator returns 412. `If-Match: *` accepts whichever revision currently
    exists and therefore deliberately gives up lost-update protection. Representation suffixes such
    as `"7-yaml"` and `"7-yaml-compact-v2"` identify different bytes of the same stored revision and
    are valid write preconditions.

    Artifacts are read and written as JSON or YAML, selected by the Accept and Content-Type
    headers. The compact YAML form is a lossy read-time convenience: it can be read but not stored.
  version: ${project.version}
components:
  schemas:
    ValidationTarget:
      description: |
        What POST /command/validate accepts as JSON: an artifact, or an instance together with the
        template to validate it against. The composite form is a JSON convenience rather than an
        artifact, so it has no YAML equivalent.
      oneOf:
        - $ref: '#/components/schemas/ArtifactDocument'
        - $ref: '#/components/schemas/InstanceWithSchema'
    InstanceWithSchema:
      type: object
      description: An instance and the template it is validated against.
      required:
        - instance
      properties:
        schema:
          allOf:
            - $ref: '#/components/schemas/ArtifactDocument'
          description: |
            The template to validate the instance against. It is validated first, and a template
            that does not itself pass is reported in place of the instance. Omitting it validates
            the instance against the stored template it names.
        instance:
          allOf:
            - $ref: '#/components/schemas/ArtifactDocument'
          description: The instance to validate.
      additionalProperties: false
  securitySchemes:
    artifact_service:
      type: apiKey
      name: X-CEDAR-Artifact-Service-Key
      in: header
      description: Private installation credential for trusted artifact callers; required alongside user authorization.
    api_key:
      type: apiKey
      name: Authorization
      in: header
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"
