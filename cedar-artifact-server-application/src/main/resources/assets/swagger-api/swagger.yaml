openapi: 3.0.1
info:
  description: |
    Better Metadata - Better Science

    Internal service: business routes require both X-CEDAR-Artifact-Service-Key and the
    end-user Authorization header. Public callers use resource; a user API key alone is insufficient.

    The artifact server stores templates, template elements, template fields, and template
    instances, and validates every one of them against the CEDAR model before storing it.

    Artifacts use strong ETags for optimistic concurrency. Read the artifact and send the returned
    ETag in `If-Match` when replacing or deleting it. A missing required precondition returns 428;
    a stale or malformed validator returns 412. `If-Match: *` accepts whichever revision currently
    exists and therefore deliberately gives up lost-update protection. Representation suffixes such
    as `"7-yaml"` and `"7-yaml-compact-v2"` identify different bytes of the same stored revision and
    are valid write preconditions.

    Artifacts are read and written as JSON or YAML, selected by the Accept and Content-Type
    headers. The compact YAML form is a lossy read-time convenience: it can be read but not stored.
  title: CEDAR Artifact Server API
  version: 2.9.13-SNAPSHOT
paths:
  /:
    get:
      operationId: showInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The service name and links to its API documentation
      summary: Describe this CEDAR service
      tags:
      - Service
  /command/validate:
    post:
      description: "Validate an artifact against the CEDAR model without storing it.\
        \ The body may be JSON or YAML, selected by the Content-Type header, so a\
        \ client that authors in YAML can ask whether its work is valid before sending\
        \ it. An instance may instead be validated against a template supplied alongside\
        \ it, as `{\"schema\": …, \"instance\": …}`; that composite is a JSON convenience\
        \ rather than an artifact, so it has no YAML form and a YAML body is read\
        \ as the artifact itself. The report is returned with 200 whether or not the\
        \ artifact is valid: an invalid artifact is an answer, not a failed request."
      operationId: validateResource
      parameters:
      - description: "Artifact type to validate against: `template`, `element`, `field`,\
          \ or `instance`."
        in: query
        name: resource_type
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationTarget"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/ArtifactDocument"
          application/yaml:
            schema:
              $ref: "#/components/schemas/ArtifactDocument"
        description: "The artifact to validate, or an instance and the template to\
          \ validate it against."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
          description: The validation report
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The body could not be read as the named artifact type
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The validation could not be run
      security:
      - api_key: []
        artifact_service: []
      summary: Validate an artifact
      tags:
      - Command
  /healthcheck:
    get:
      operationId: healthCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Every health check passed
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                type: object
          description: At least one health check failed
      security:
      - api_key: []
      summary: Run this service's health checks
      tags:
      - Service diagnostics
  /insight/full:
    get:
      operationId: full
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report all JVM diagnostics except per-thread stack traces
      tags:
      - Service diagnostics
  /insight/gc:
    get:
      operationId: gc
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM garbage-collection counts
      tags:
      - Service diagnostics
  /insight/memory:
    get:
      operationId: memory
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM memory use
      tags:
      - Service diagnostics
  /insight/system:
    get:
      operationId: system
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report operating-system information
      tags:
      - Service diagnostics
  /insight/thread-details:
    get:
      operationId: threadDetails
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report details and stack traces for every JVM thread
      tags:
      - Service diagnostics
  /insight/threads:
    get:
      operationId: threads
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM thread counts
      tags:
      - Service diagnostics
  /monitor/artifact-counts:
    get:
      description: "Requires MONITOR_READ. Counts stored documents, including any\
        \ absent from the workspace graph."
      operationId: counts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactCounts"
          description: Actual artifact document-store counts
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks monitor read permission
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Artifact counts are unavailable
      security:
      - api_key: []
      summary: Count artifact documents
      tags:
      - Monitoring
  /template-elements:
    get:
      description: "List template elements, one page at a time. The response carries\
        \ the size of the whole collection and paging links, not just the returned\
        \ page."
      operationId: findAllTemplateElements
      parameters:
      - description: Maximum number of artifacts to return.
        in: query
        name: limit
        schema:
          type: integer
          format: int32
      - description: Number of artifacts to skip before the first one returned.
        in: query
        name: offset
        schema:
          type: integer
          format: int32
      - description: Return only the summary fields configured for this artifact type.
        in: query
        name: summary
        schema:
          type: boolean
      - description: "Comma-separated list of fields to return, in place of the default\
          \ selection. Ignored when `summary` is set."
        in: query
        name: field_names
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchemaArtifactDocument"
          description: A page of template elements
          headers:
            Link:
              description: "Paging links for the first, previous, next, and last pages,\
                \ where those exist."
              schema:
                type: string
              style: simple
            Total-Count:
              description: "Total number of artifacts of this type, which is the whole\
                \ collection rather than the returned page."
              schema:
                type: integer
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "A paging parameter is out of range, or field_names is combined\
            \ with summary=true"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
        artifact_service: []
      summary: List template elements
      tags:
      - Template elements
    post:
      description: "Create a template element. The body may be JSON or YAML, selected\
        \ by the Content-Type header. A YAML body must be the full or minimal form.\
        \ The artifact is validated against the CEDAR model before it is stored; an\
        \ invalid one is refused rather than stored. The server mints the identifier,\
        \ so the body must carry none, and must carry a name."
      operationId: createTemplateElement
      parameters:
      - description: "Not supported on writes, and rejected with 400. A write response\
          \ always renders the full form, and the compact form can not be stored."
        in: query
        name: compact
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaArtifactDocument"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/SchemaArtifactDocument"
          application/yaml:
            schema:
              $ref: "#/components/schemas/SchemaArtifactDocument"
        description: The template element to store.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
            application/yaml:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
          description: The stored template element
          headers:
            CEDAR-Validation-Status:
              description: Whether the artifact passed validation against the CEDAR
                model. Every write is validated; an invalid artifact is refused rather
                than stored.
              schema:
                type: string
              style: simple
            ETag:
              description: Strong validator for the returned representation and its
                stored revision. A representation suffix such as "7-yaml" identifies
                different bytes of the same stored revision and is a valid write precondition.
              schema:
                type: string
              style: simple
            Location:
              description: URL of the created artifact.
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The body is empty, carries an identifier, has no name, or\
            \ failed validation"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "406":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The Accept header names no representation this artifact can
            be served in.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
        artifact_service: []
      summary: Create a template element
      tags:
      - Template elements
  /template-elements/{id}:
    delete:
      description: "Delete a template element. Conditional on the current ETag, so\
        \ a delete can not discard a revision written since the artifact was read."
      operationId: deleteTemplateElement
      parameters:
      - description: "Strong ETag returned by the corresponding GET. `*` accepts whichever\
          \ revision currently exists and therefore deliberately gives up lost-update\
          \ protection. Weak, stale, and malformed validators fail with 412."
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: "Artifact identifier, as an absolute IRI."
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The identifier is not a valid URL
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such artifact
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The supplied If-Match value is stale, weak, or malformed,\
            \ or the artifact has been written since it was read. Where a revision\
            \ still exists, the error body's `parameters.currentETag` identifies it."
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Writing over an artifact that already exists requires its current
            ETag in If-Match.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
        artifact_service: []
      summary: Delete a template element
      tags:
      - Template elements
    get:
      description: "Get a template element by identifier. Served as JSON or YAML,\
        \ selected by the Accept header."
      operationId: findTemplateElement
      parameters:
      - description: "Artifact identifier, as an absolute IRI."
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: "Return the compact YAML form. It is a lossy read-time convenience,\
          \ so it is accepted only on reads."
        in: query
        name: compact
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
            application/yaml:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
          description: The stored template element
          headers:
            ETag:
              description: Strong validator for the returned representation and its
                stored revision. A representation suffix such as "7-yaml" identifies
                different bytes of the same stored revision and is a valid write precondition.
              schema:
                type: string
              style: simple
            Vary:
              description: "Accept, since the representation is negotiated."
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The identifier is not a valid URL
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such artifact
        "406":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The Accept header names no representation this artifact can
            be served in.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
        artifact_service: []
      summary: Get a template element
      tags:
      - Template elements
    put:
      description: "Replace a template element, or create one at a client-supplied\
        \ identifier that does not yet exist. The body may be JSON or YAML, selected\
        \ by the Content-Type header. A YAML body must be the full or minimal form.\
        \ Replacing an artifact that exists is conditional: the current ETag must\
        \ be supplied in If-Match, so a write can not silently overwrite one that\
        \ landed since the artifact was read."
      operationId: updateTemplateElement
      parameters:
      - description: Required when the identifier already exists and the PUT replaces
          it; omit it when creating an artifact with a new client-supplied identifier.
          Supplying it for an absent artifact fails with 412 rather than creating
          one.
        in: header
        name: If-Match
        schema:
          type: string
      - description: "Artifact identifier, as an absolute IRI."
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: "Not supported on writes, and rejected with 400. A write response\
          \ always renders the full form, and the compact form can not be stored."
        in: query
        name: compact
        schema:
          type: boolean
      - description: "Store the body exactly as supplied, without preserving creation\
          \ provenance or minting missing child identifiers. Requires the verbatim-write\
          \ permission."
        in: query
        name: verbatim
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaArtifactDocument"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/SchemaArtifactDocument"
          application/yaml:
            schema:
              $ref: "#/components/schemas/SchemaArtifactDocument"
        description: The template element to store at that identifier.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
            application/yaml:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
          description: The replaced a template element
          headers:
            CEDAR-Validation-Status:
              description: Whether the artifact passed validation against the CEDAR
                model. Every write is validated; an invalid artifact is refused rather
                than stored.
              schema:
                type: string
              style: simple
            ETag:
              description: Strong validator for the returned representation and its
                stored revision. A representation suffix such as "7-yaml" identifies
                different bytes of the same stored revision and is a valid write precondition.
              schema:
                type: string
              style: simple
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
            application/yaml:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
          description: A template element created at the supplied identifier
          headers:
            ETag:
              description: Strong validator for the returned representation and its
                stored revision. A representation suffix such as "7-yaml" identifies
                different bytes of the same stored revision and is a valid write precondition.
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The body is empty, has no name, or failed validation"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "406":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The Accept header names no representation this artifact can
            be served in.
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The supplied If-Match value is stale, weak, or malformed,\
            \ or the artifact has been written since it was read. Where a revision\
            \ still exists, the error body's `parameters.currentETag` identifies it."
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Writing over an artifact that already exists requires its current
            ETag in If-Match.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
