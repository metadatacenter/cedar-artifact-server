            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Get a template
      tags:
      - Templates
    put:
      description: "Replace a template, or create one at a client-supplied identifier\
        \ that does not yet exist. The body may be JSON or YAML, selected by the Content-Type\
        \ header. A YAML body must be the full or minimal form. Replacing an artifact\
        \ that exists is conditional: the current ETag must be supplied in If-Match,\
        \ so a write can not silently overwrite one that landed since the artifact\
        \ was read."
      operationId: updateTemplate
      parameters:
      - description: Required when the identifier already exists and the PUT replaces
          it; omit it when creating an artifact with a new client-supplied identifier.
