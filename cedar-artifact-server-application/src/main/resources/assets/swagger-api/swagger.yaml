          description: The stored template
          headers:
            ETag:
              description: Strong validator for the returned representation and its
                stored revision. A representation suffix such as "7-yaml" identifies
                different bytes of the same stored revision and is a valid write precondition.
              schema:
                type: string
              style: simple
            Vary:
              description: "Accept, since the representation is negotiated."
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The identifier is not a valid URL
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such artifact
        "406":
          content:
