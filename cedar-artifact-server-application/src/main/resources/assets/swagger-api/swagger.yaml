        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "406":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The Accept header names no representation this artifact can
            be served in.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
