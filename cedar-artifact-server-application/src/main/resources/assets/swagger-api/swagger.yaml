              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The supplied If-Match value is stale, weak, or malformed,\
            \ or the artifact has been written since it was read. Where a revision\
            \ still exists, the error body's `parameters.currentETag` identifies it."
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Writing over an artifact that already exists requires its current
            ETag in If-Match.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
            application/yaml:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
        artifact_service: []
      summary: Replace a template
      tags:
      - Templates
components:
  schemas:
    ArtifactCounts:
      type: object
      properties:
        element:
          type: integer
          format: int64
        field:
          type: integer
          format: int64
        instance:
          type: integer
          format: int64
        template:
          type: integer
          format: int64
    ArtifactDocument:
      type: object
      additionalProperties: true
      description: "An open CEDAR JSON-LD artifact: the identity and provenance keys\
        \ that templates, elements, fields and instances all carry. Kind-specific\
        \ keys are described by SchemaArtifactDocument and InstanceArtifactDocument;\
        \ the authoritative definition of each kind is the CEDAR model's JSON Schema."
      externalDocs:
        description: The CEDAR template model
        url: https://more.metadatacenter.org/tools-training/outreach/cedar-template-model
      properties:
        '@context':
          type: object
          additionalProperties: true
          description: JSON-LD context for the keys the artifact uses.
        '@id':
          type: string
          format: uri
          description: "The artifact's IRI. The server mints it on a POST, so a body\
            \ sent to POST carries none; a body sent to PUT carries the IRI of the\
            \ path."
        oslc:modifiedBy:
          type: string
          format: uri
          description: IRI of the user who last changed it.
        pav:createdBy:
          type: string
          format: uri
          description: IRI of the user who created it.
        pav:createdOn:
          type: string
          format: date-time
          description: When the artifact was created.
        pav:lastUpdatedOn:
          type: string
          format: date-time
          description: When the artifact was last changed.
        schema:description:
          type: string
          description: Description shown with the name.
        schema:name:
          type: string
          description: Display name.
    CedarError:
      type: object
      additionalProperties: false
      description: A CEDAR error response. Diagnostic fields are populated only when
        they are relevant to the failure.
      properties:
        entities:
          type: object
          additionalProperties:
            type: object
            description: Named domain entities associated with exception-mapped errors.
            nullable: true
          description: Named domain entities associated with exception-mapped errors.
          nullable: true
        errorId:
          type: string
          format: uuid
          description: Correlation identifier for an internal error recorded in server
            logs.
          nullable: true
        errorKey:
          type: string
          description: Stable machine-readable error identifier.
          enum:
          - templateElementNotCreated
          - templateElementNotFound
          - templateElementNotDeleted
          - templateElementNotUpdated
          - templateElementsNotListed
          - templateFieldNotCreated
          - templateFieldNotFound
          - templateFieldNotDeleted
          - templateFieldNotUpdated
          - templateFieldsNotListed
          - templateNotCreated
          - templateNotFound
          - templateNotDeleted
          - templateNotUpdated
          - templatesNotListed
          - templateInstanceNotCreated
          - templateInstanceNotFound
          - templateInstanceNotDeleted
          - templateInstanceNotUpdated
          - templateInstancesNotListed
          - noReadAccessToResource
          - noWriteAccessToResource
          - noReadAccessToFolder
          - noWriteAccessToFolder
          - noReadAccessToTemplate
          - noWriteAccessToTemplate
          - noReadAccessToTemplateElement
          - noWriteAccessToTemplateElement
          - noReadAccessToTemplateField
          - noWriteAccessToTemplateField
          - noReadAccessToTemplateInstance
          - noWriteAccessToTemplateInstance
          - noReadAccessToArtifact
          - noWriteAccessToArtifact
          - noReadAccessToCategory
          - noWriteAccessToCategory
          - folderNotFound
          - artifactNotFound
          - artifactPreconditionRequired
          - artifactHasMovedOn
          - verbatimWriteRefused
          - nodeNotFound
          - unknownResourceType
          - missingParameter
          - invalidInput
          - sourceFolderNotFound
          - sourceResourceNotFound
          - targetFolderNotFound
          - nodeNotMoved
          - groupNotFound
          - userNotFound
          - uniqueConstraintCollision
          - invalidData
          - notAuthorized
          - permissionMissing
          - tokenInvalid
          - userInfoLoadByTokenFailed
          - userInfoLoadByApiKeyFailed
          - cedarUserNotFound
          - authorizationNotFound
          - permissionNotOwned
          - authorizationTypeUnknown
          - apiKeyNotFound
          - tokenMissing
          - tokenExpired
          - parentFolderNotSpecified
          - parentFolderSpecifiedTwice
          - pathNotNormalized
          - parentFolderNotFound
          - updateInvalidFolderName
          - createInvalidFolderName
          - nodeAlreadyPresent
          - folderNotCreated
          - missingNameAndDescription
          - missingData
          - folderNotDeleted
          - artifactNotDeleted
          - resourceNotCreated
          - invalidResourceType
          - invalidArtifactType
          - readOtherProfileForbidden
          - updateOtherProfileForbidden
          - folderCanNotBeDeleted
          - folderCanNotBeChanged
          - groupAlreadyPresent
          - groupCanBeModifiedOnlyByGroupAdmin
          - groupCanBeDeletedOnlyByGroupAdmin
          - groupMembersCanBeReadOnlyByGroupAdmin
          - groupRequiresAdministrator
          - groupUsersNotUpdated
          - specialGroupCanNotBeDeleted
          - folderPermissionsCanNotBeChanged
          - unknownInstanceOutputFormat
          - folderCopyNotAllowed
          - methodNotImplemented
          - upstreamServerError
          - nothingToDo
          - parentCategoryNotFound
          - categoryAlreadyPresent
          - categoryNotFound
          - categoryCanNotBeDeleted
          - rootCategoryCanNotBeDeleted
          - unableToAttachCategory
          - unableToDetachCategory
          - noCategoriesWereAttached
          - malformedJsonRequestBody
          - malformedSearchTerm
          - publishedArtifactCanNotBeChanged
          - publishedArtifactCanNotBeDeleted
          - versioningOnlyOnLatest
          - versioningOnlyByOwner
          - nonVersionedArtifactType
          - createDraftOnlyFromPublished
          - publishOnlyDraft
          - draftNotCreated
          - contentNotValid
          - doiNotSupportedByResourceType
          - doiCanNotBeSetForEmptyAtId
          - doiCanNotBeAltered
          - doiCanNotBeSet
          - doiAlreadyExists
          - dataCiteDOIDisabled
          - pinnedVersionUnavailable
          - resourceNotFound
          - internalError
          nullable: true
        errorReasonKey:
          type: string
          description: More specific machine-readable reason for the error.
          enum:
          - nonEmptyFolder
          - nonEmptyCategory
          - userHomeFolder
          - systemFolder
          - templateReferencedInInstances
          - validationError
          - continuationExpired
          nullable: true
        errorType:
          type: string
          description: Broad category of the error.
          enum:
          - notFound
          - invalidArgument
          - authorization
          - permission
          - server
          - validationError
          nullable: true
        message:
          type: string
          description: Human-readable error message.
          nullable: true
        objects:
          type: object
          additionalProperties:
            type: object
            description: Named structured values associated with the error.
          description: Named structured values associated with the error.
        operation:
          type: object
          description: Operation that failed. Its fields depend on the operation type.
          nullable: true
        parameters:
          type: object
          additionalProperties:
            type: object
            description: Named scalar values associated with the error.
          description: Named scalar values associated with the error.
        status:
          type: string
          description: Symbolic HTTP response status.
          enum:
          - BAD_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - NOT_ACCEPTABLE
          - CONFLICT
          - PRECONDITION_FAILED
          - UNSUPPORTED_MEDIA_TYPE
          - UNPROCESSABLE_ENTITY
          - PRECONDITION_REQUIRED
          - INTERNAL_SERVER_ERROR
          - NOT_IMPLEMENTED
          - BAD_GATEWAY
          - SERVICE_UNAVAILABLE
          - HTTP_VERSION_NOT_SUPPORTED
        statusCode:
          type: integer
          format: int32
          description: Numeric HTTP response status.
          maximum: 599
          minimum: 400
        suggestedAction:
          type: string
          description: Recovery action suggested to the client.
          enum:
          - none
          - requestRole
          - logout
          - logoutImmediately
          - provideAuthorizationHeader
          - refreshToken
          nullable: true
      required:
      - status
      - statusCode
    ErrorItem:
      type: object
      description: "Everything that makes the artifact invalid, in the order found."
      properties:
        additionalInfo:
          type: object
          additionalProperties:
            type: object
        location:
          type: string
        message:
          type: string
    InstanceArtifactDocument:
      type: object
      additionalProperties: true
      description: "A template instance. Its value keys are the names of the template's\
        \ fields and elements, so the only fixed key beyond the common artifact keys\
        \ is the template it is based on."
      properties:
        '@context':
          type: object
          additionalProperties: true
          description: JSON-LD context for the keys the artifact uses.
        '@id':
          type: string
          format: uri
          description: "The artifact's IRI. The server mints it on a POST, so a body\
            \ sent to POST carries none; a body sent to PUT carries the IRI of the\
            \ path."
        oslc:modifiedBy:
          type: string
          format: uri
          description: IRI of the user who last changed it.
        pav:createdBy:
          type: string
          format: uri
          description: IRI of the user who created it.
        pav:createdOn:
          type: string
          format: date-time
          description: When the artifact was created.
        pav:lastUpdatedOn:
          type: string
          format: date-time
          description: When the artifact was last changed.
        schema:description:
          type: string
          description: Description shown with the name.
        schema:isBasedOn:
          type: string
          format: uri
          description: IRI of the template the instance was filled in against.
        schema:name:
          type: string
          description: Display name.
    InstanceWithSchema:
      type: object
      additionalProperties: false
      description: An instance and the template it is validated against.
      properties:
        instance:
          allOf:
          - $ref: "#/components/schemas/ArtifactDocument"
          description: The instance to validate.
        schema:
          allOf:
          - $ref: "#/components/schemas/ArtifactDocument"
          description: |
            The template to validate the instance against. It is validated first, and a template
            that does not itself pass is reported in place of the instance. Omitting it validates
            the instance against the stored template it names.
      required:
      - instance
    SchemaArtifactDocument:
      type: object
      additionalProperties: true
      description: "A template, template element or template field. Beyond the common\
        \ artifact keys it carries the model's versioning keys and the JSON Schema\
        \ keys that declare the properties an instance may hold. The entries under\
        \ `properties` depend on the artifact."
      properties:
        $schema:
          type: string
          format: uri
          description: The JSON Schema dialect IRI.
        '@context':
          type: object
          additionalProperties: true
          description: JSON-LD context for the keys the artifact uses.
        '@id':
          type: string
          format: uri
          description: "The artifact's IRI. The server mints it on a POST, so a body\
            \ sent to POST carries none; a body sent to PUT carries the IRI of the\
            \ path."
        '@type':
          type: string
          format: uri
          description: IRI of the artifact kind.
          enum:
          - https://schema.metadatacenter.org/core/Template
          - https://schema.metadatacenter.org/core/TemplateElement
          - https://schema.metadatacenter.org/core/TemplateField
          - https://schema.metadatacenter.org/core/StaticTemplateField
        _ui:
          type: object
          additionalProperties: true
          description: "Editor rendering directives: child order, labels, descriptions\
            \ and, for a field, its input type."
        bibo:status:
          type: string
          description: Publication status. A published artifact can no longer be changed.
          enum:
          - bibo:draft
          - bibo:published
        description:
          type: string
          description: "JSON Schema description, derived from the name."
        oslc:modifiedBy:
          type: string
          format: uri
          description: IRI of the user who last changed it.
        pav:createdBy:
          type: string
          format: uri
          description: IRI of the user who created it.
        pav:createdOn:
          type: string
          format: date-time
          description: When the artifact was created.
        pav:derivedFrom:
          type: string
          format: uri
          description: "IRI of the artifact this one was copied from, when there is\
            \ one."
          nullable: true
        pav:lastUpdatedOn:
          type: string
          format: date-time
          description: When the artifact was last changed.
        pav:previousVersion:
          type: string
          format: uri
          description: "IRI of the version this one was drafted from, when there is\
            \ one."
          nullable: true
        pav:version:
          type: string
          description: The artifact's own version.
        properties:
          type: object
          additionalProperties: true
          description: "One entry per child field or element, keyed by its name, plus\
            \ the JSON-LD keys an instance must carry."
        required:
          type: array
          description: Names of the properties an instance must carry.
          items:
            type: string
            description: Names of the properties an instance must carry.
        schema:description:
          type: string
          description: Description shown with the name.
        schema:identifier:
          type: string
          description: Caller-assigned identifier.
          nullable: true
        schema:name:
          type: string
          description: Display name.
        schema:schemaVersion:
          type: string
          description: Version of the CEDAR model the artifact conforms to.
        title:
          type: string
          description: "JSON Schema title, derived from the name."
        type:
          type: string
          description: Always `object`.
    ValidationReport:
      type: object
      description: "What validating an artifact against the CEDAR model found. Returned\
        \ with 200 whether or not the artifact is valid: an invalid artifact is an\
        \ answer, not a failed request. The artifact server produces it, and the resource\
        \ server hands the same document back unchanged."
      properties:
        errors:
          type: array
          description: "Everything that makes the artifact invalid, in the order found."
          items:
            $ref: "#/components/schemas/ErrorItem"
          uniqueItems: true
        validates:
          type: string
          description: "Whether the artifact validates, as a string. One error makes\
            \ it false; warnings alone still validate."
          enum:
          - "true"
          - "false"
        warnings:
          type: array
          description: "Everything the artifact should change but need not, in the\
            \ order found."
          items:
            $ref: "#/components/schemas/WarningItem"
          uniqueItems: true
      required:
      - errors
      - validates
      - warnings
    ValidationTarget:
      description: |
        What POST /command/validate accepts as JSON: an artifact, or an instance together with the
        template to validate it against. The composite form is a JSON convenience rather than an
        artifact, so it has no YAML equivalent.
      oneOf:
      - $ref: "#/components/schemas/ArtifactDocument"
      - $ref: "#/components/schemas/InstanceWithSchema"
    WarningItem:
      type: object
      description: "Everything the artifact should change but need not, in the order\
        \ found."
      properties:
        additionalInfo:
          type: object
          additionalProperties:
            type: object
        location:
          type: string
        message:
          type: string
  securitySchemes:
    api_key:
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"
      in: header
      name: Authorization
      type: apiKey
    artifact_service:
      description: Private installation credential for trusted artifact callers; required
        alongside user authorization.
      in: header
      name: X-CEDAR-Artifact-Service-Key
      type: apiKey
