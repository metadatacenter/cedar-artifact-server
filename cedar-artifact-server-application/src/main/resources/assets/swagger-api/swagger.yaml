      tags:
      - Templates
  /templates/{id}:
    delete:
      description: "Delete a template. Conditional on the current ETag, so a delete\
        \ can not discard a revision written since the artifact was read."
      operationId: deleteTemplate
      parameters:
      - description: "Strong ETag returned by the corresponding GET. `*` accepts whichever\
          \ revision currently exists and therefore deliberately gives up lost-update\
          \ protection. Weak, stale, and malformed validators fail with 412."
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: "Artifact identifier, as an absolute IRI."
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The artifact is referenced by stored instances and was not
            deleted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such artifact
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The supplied If-Match value is stale, weak, or malformed,\
            \ or the artifact has been written since it was read. Where a revision\
            \ still exists, the error body's `parameters.currentETag` identifies it."
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Writing over an artifact that already exists requires its current
            ETag in If-Match.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Delete a template
      tags:
      - Templates
    get:
