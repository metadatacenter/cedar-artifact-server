          format: int32
      - description: Return only the summary fields configured for this artifact type.
        in: query
        name: summary
        schema:
          type: boolean
      - description: "Comma-separated list of fields to return, in place of the default\
          \ selection. Ignored when `summary` is set."
        in: query
        name: field_names
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactDocument"
          description: A page of templates
          headers:
            Link:
              description: "Paging links for the first, previous, next, and last pages,\
                \ where those exist."
              schema:
                type: string
              style: simple
            Total-Count:
              description: "Total number of artifacts of this type, which is the whole\
                \ collection rather than the returned page."
              schema:
                type: integer
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A paging parameter is out of range
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: List templates
      tags:
      - Templates
    post:
      description: "Create a template. The body may be JSON or YAML, selected by the\
        \ Content-Type header. A YAML body must be the full or minimal form. The artifact\
        \ is validated against the CEDAR model before it is stored; an invalid one\
        \ is refused rather than stored. The server mints the identifier, so the body\
        \ must carry none, and must carry a name."
      operationId: createTemplate
      parameters:
      - description: "Not supported on writes, and rejected with 400. A write response\
          \ always renders the full form, and the compact form can not be stored."
        in: query
        name: compact
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: string
          application/x-yaml:
            schema:
              type: string
          application/yaml:
            schema:
              type: string
      responses:
        "201":
          description: The stored template
          headers:
            CEDAR-Validation-Status:
              description: Whether the artifact passed validation against the CEDAR
                model. Every write is validated; an invalid artifact is refused rather
                than stored.
              schema:
                type: string
              style: simple
            ETag:
              description: Strong validator for the returned representation and its
                stored revision. A representation suffix such as "7-yaml" identifies
                different bytes of the same stored revision and is a valid write precondition.
              schema:
                type: string
              style: simple
            Location:
              description: URL of the created artifact.
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
